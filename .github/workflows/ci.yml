name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-enhancer-chrome
          path: dist/chrome/
          retention-days: 7

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: swagger-enhancer-firefox
          path: dist/firefox/
          retention-days: 7
